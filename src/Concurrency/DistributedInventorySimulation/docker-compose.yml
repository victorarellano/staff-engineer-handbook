services:
  postgres:
    image: postgres:16
    container_name: distributed-inventory-postgres
    environment:
      POSTGRES_DB: distributed_inventory
      POSTGRES_USER: inventory_user
      POSTGRES_PASSWORD: inventory_password
    ports:
      - "5433:5432"
    volumes:
      - distributed_inventory_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  distributed_inventory_data: